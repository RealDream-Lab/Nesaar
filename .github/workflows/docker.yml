name: Build and Push Docker image

on:
  push:
    tags:
      - 'v*'   # فقط وقتی تگ جدید (مثل v1.0.0) ساخته بشه
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to use (default: manual-<short_sha>)'
        required: false
        type: string
      push_latest:
        description: 'Also tag and push as latest'
        required: false
        default: true
        type: boolean
      push:
        description: 'Push image to registry (disable to only build)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Compute tags and options
        id: vars
        run: |
          OWNER="$OWNER"
          IMAGE="ghcr.io/${OWNER}/pnuseat"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
              TAG="manual-${SHORT_SHA}"
            fi
            PUSH_LATEST="${{ inputs.push_latest }}"
            DO_PUSH="${{ inputs.push }}"
          else
            TAG="${GITHUB_REF_NAME}"
            PUSH_LATEST="true"
            DO_PUSH="true"
          fi

          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

          TAGS="$IMAGE:$TAG"
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "do_push=$DO_PUSH" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || steps.vars.outputs.do_push == 'true' }}
          tags: ${{ steps.vars.outputs.tags }}

      - name: Prune previous GHCR package versions (keep only current tag)
        # This step attempts to delete older package versions from GHCR so only the
        # currently-built tag remains. Deleting package versions requires a token
        # with package deletion rights (a PAT stored in `secrets.CR_PAT`). We try
        # to fall back to the runtime GitHub Token, but note the GITHUB_TOKEN may
        # not have permission to delete package versions in all orgs.
        if: steps.vars.outputs.do_push == 'true' || github.event_name == 'push'
        uses: actions/github-script@v6
        env:
          OWNER: ${{ env.OWNER }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          PACKAGE_NAME: pnuseat
        with:
          # Prefer a CR_PAT (personal access token) stored in secrets.CR_PAT.
          # Fallback to the workflow token if CR_PAT isn't provided.
          github-token: ${{ secrets.CR_PAT || github.token }}
          script: |
            const owner = process.env.OWNER;
            const packageName = process.env.PACKAGE_NAME;
            const currentTag = process.env.IMAGE_TAG;
            const packageType = 'container';

            if (!currentTag) {
              core.info('No current tag available from steps.vars.outputs.image_tag — skipping prune.');
              return;
            }

            async function listVersions() {
              // Try org-owned package first, fallback to user-owned package
              try {
                const res = await github.rest.packages.listPackageVersionsForPackageOwnedByOrg({
                  org: owner,
                  package_type: packageType,
                  package_name: packageName,
                  per_page: 100
                });
                return { res, type: 'org' };
              } catch (errOrg) {
                // fallback to user
                const res = await github.rest.packages.listPackageVersionsForPackageOwnedByUser({
                  username: owner,
                  package_type: packageType,
                  package_name: packageName,
                  per_page: 100
                });
                return { res, type: 'user' };
              }
            }

            const listResult = await listVersions();
            const versions = (listResult.res && listResult.res.data) || [];
            core.info(`Found ${versions.length} package versions for ${packageName} (owner=${owner}).`);

            for (const v of versions) {
              const tags = (v.metadata && v.metadata.container && v.metadata.container.tags) || [];
              // If this version has the currently built tag, keep it.
              if (tags.includes(currentTag)) {
                core.info(`Keeping version ${v.id} with tags: ${tags.join(',')}`);
                continue;
              }

              // Attempt deletion. Try org endpoint first, then user endpoint.
              try {
                if (listResult.type === 'org') {
                  await github.rest.packages.deletePackageVersionForOrg({
                    org: owner,
                    package_type: packageType,
                    package_name: packageName,
                    package_version_id: v.id
                  });
                } else {
                  await github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: packageType,
                    package_name: packageName,
                    package_version_id: v.id
                  });
                }
                core.info(`Deleted package version ${v.id} (tags: ${tags.join(',')}).`);
              } catch (errDelete) {
                core.warning(`Failed to delete package version ${v.id}: ${errDelete.message || errDelete}`);
              }
            }
