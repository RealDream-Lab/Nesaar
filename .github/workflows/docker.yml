name: Build and Push Docker image

on:
  push:
    tags:
      - 'v*'   # فقط وقتی تگ جدید (مثل v1.0.0) ساخته بشه
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Show ref info (debug)
        run: |
          echo "ref=$GITHUB_REF"
          echo "ref_name=${{ github.ref_name }}"

      - name: Login to GHCR with GITHUB_TOKEN
        if: ${{ secrets.CR_PAT == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR with CR_PAT
        if: ${{ secrets.CR_PAT != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pnuseat:latest
            ghcr.io/${{ env.OWNER }}/pnuseat:${{ github.ref_name }}