<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - نسار</title>
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fonts/vazir/vazir.css">
    <link rel="stylesheet" href="../assets/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="../assets/app/style.css">
    <style>
        body {
            background: linear-gradient(180deg, rgba(18, 126, 189, 0.9), rgba(26, 111, 166, 0.8)),
                url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0gNDAgMCBMIDAgMCAwIDQwIiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==');
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            background-attachment: fixed;
            background-size: cover;
        }

        .dashboard-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        .dashboard-container {
            position: relative;
            z-index: 1;
        }

        .dashboard-header {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-box {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            margin-bottom: 1rem;
        }

        .stat-box h3 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
        }

        .stat-box p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .btn-logout:hover {
            background: #c82333;
            color: white;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <div class="dashboard-container">
            <!-- Header -->
            <div class="dashboard-header">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="admin-info">
                        <div class="admin-avatar">👤</div>
                        <div>
                            <h5 class="mb-0">خوش آمدید</h5>
                            <small class="text-muted" id="adminUsername">مدیر سیستم</small>
                        </div>
                    </div>
                    <button class="btn btn-logout" id="logoutBtn">خروج</button>
                </div>
            </div> <!-- Stats -->
            <div class="row">
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <div class="stat-box">
                            <h3 id="totalStudents">-</h3>
                            <p>تعداد دانشجویان</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <div class="stat-box">
                            <h3 id="totalCourses">-</h3>
                            <p>تعداد دروس</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <div class="stat-box">
                            <h3 id="totalSeats">-</h3>
                            <p>تعداد صندلی‌ها</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Info -->
            <div class="dashboard-card">
                <h4 class="mb-3">اطلاعات لایسنس</h4>
                <table class="table table-borderless">
                    <tbody>
                        <tr>
                            <td><strong>نام دانشگاه:</strong></td>
                            <td id="universityName">-</td>
                        </tr>
                        <tr>
                            <td><strong>کد مرکز:</strong></td>
                            <td id="saadCode">-</td>
                        </tr>
                        <tr>
                            <td><strong>شماره سریال:</strong></td>
                            <td><code id="licenseToken" class="license-token-blur"
                                    style="font-family: monospace; background: #f5f5f5; padding: 4px 8px; border-radius: 4px; filter: blur(5px); transition: filter 0.3s ease; cursor: pointer;">-</code>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Quick Actions -->
            <div class="dashboard-card">
                <h4 class="mb-3">عملیات سریع</h4>
                <div class="d-grid gap-2 d-md-flex">
                    <button class="btn btn-primary" onclick="window.location.href='../'">
                        بازگشت به صفحه اصلی
                    </button>
                    <button class="btn btn-outline-primary" id="refreshDataBtn">
                        بروزرسانی اطلاعات
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Footer -->
    <footer class="fixed-footer" id="copyrightFooter" style="cursor: pointer; text-align: center;">
        <span class="footer-text" id="footerText"
            style="color: white; font-weight: 600; text-shadow: 0 0 3px rgba(0,0,0,0.8), 0 0 5px rgba(0,0,0,0.6);">نسار
            - دانشگاه پیام نور بیجار</span>
    </footer>

    <!-- Waves Background -->
    <div class="waves-header" aria-hidden="true">
        <div class="waves-inner-header"></div>
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
            viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(12, 114, 173, 0.22)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(18, 126, 189, 0.28)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(24, 140, 205, 0.32)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#1a6fa6" />
            </g>
        </svg>
    </div>

    <script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/sweetalert2/sweetalert2.min.js"></script>
    <script>
        // Check admin authentication
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function checkAuth() {
            const adminSession = getCookie('adminSession');
            if (!adminSession) {
                window.location.href = '../';
                return false;
            }
            try {
                const session = JSON.parse(decodeURIComponent(adminSession));
                if (session.type !== 'admin') {
                    window.location.href = '../';
                    return false;
                }
                document.getElementById('adminUsername').textContent = session.username || 'مدیر سیستم';
                return true;
            } catch (e) {
                window.location.href = '../';
                return false;
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.cookie = 'adminSession=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '../';
        });

        // Load dashboard data
        async function loadDashboardData() {
            try {
                // Get config
                const configResponse = await fetch('../API/getConfig.php', { cache: 'no-store' });
                const config = await configResponse.json();

                document.getElementById('universityName').textContent = config.University || '-';
                document.getElementById('saadCode').textContent = config.SaadCode || '-';
                document.getElementById('licenseToken').textContent = config.LicenseToken || '-';

                // Update admin nickname if available
                if (config.AdminNickName) {
                    document.getElementById('adminUsername').textContent = config.AdminNickName;
                }

                // Get statistics
                const statsResponse = await fetch('../API/getStatistics.php', { cache: 'no-store' });
                const stats = await statsResponse.json();

                if (!stats.error) {
                    document.getElementById('totalStudents').textContent = stats.totalStudents || 0;
                    document.getElementById('totalCourses').textContent = stats.totalCourses || 0;
                    document.getElementById('totalSeats').textContent = stats.totalSeats || 0;
                }
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'خطا',
                    text: 'خطا در بارگذاری اطلاعات'
                });
            }
        }        // Blur/Unblur license token on hover
        const licenseToken = document.getElementById('licenseToken');
        licenseToken.addEventListener('mouseenter', () => {
            licenseToken.style.filter = 'blur(0)';
        });
        licenseToken.addEventListener('mouseleave', () => {
            licenseToken.style.filter = 'blur(5px)';
        });        // Refresh data
        document.getElementById('refreshDataBtn').addEventListener('click', () => {
            loadDashboardData();
            Swal.fire({
                icon: 'success',
                title: 'بروزرسانی شد',
                text: 'اطلاعات با موفقیت بروزرسانی شد',
                timer: 1500,
                showConfirmButton: false
            });
        });

        // Update footer university name
        async function updateFooterUniversity() {
            try {
                const response = await fetch('../API/getConfig.php', { cache: 'no-store' });
                const config = await response.json();
                if (config.University) {
                    document.getElementById('footerText').textContent = `نسار - ${config.University}`;
                }
            } catch (error) {
                console.error('Error updating footer:', error);
            }
        }
        updateFooterUniversity();

        // Footer click event
        const copyrightFooter = document.getElementById('copyrightFooter');
        if (copyrightFooter) {
            copyrightFooter.addEventListener('click', async () => {
                const VERSION = '۲.۰.۰';
                function toPersianDigits(num) {
                    const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
                    return String(num).replace(/\d/g, d => persianDigits[d]);
                }
                function escapeHtml(text) {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                }

                let countdownInterval;
                const configResponse = await fetch('../API/getConfig.php', { cache: 'no-store' });
                const config = await configResponse.json();
                const university = config.University || 'دانشگاه پیام نور مرکز بیجار';

                Swal.fire({
                    title: 'درباره اپلیکیشن',
                    html: `
            <div style="line-height:1.9;font-size:1.05rem;text-align:justify;">
              نِسار (نسخه ${VERSION}) یک وب‌اپلیکیشن پیشرفته و مدرن است که با بهره‌گیری از طراحی مبتنی بر تجربه کاربری نوین و سبک گلس‌مورفیسم، به دانشجویان دانشگاه پیام نور این امکان را می‌دهد تا برنامه امتحانات، شماره صندلی، محل برگزاری و وضعیت آزمون‌های خود را به‌صورت یکپارچه و متمرکز مشاهده کنند.
              <br>
              این برنامه به سفارش <span style="color: lime; font-weight: bold;">${escapeHtml(university)}</span> و توسط <a href="https://t.me/RealDream" target="_blank" style="color: gold; font-weight: bold; text-decoration: none; border: none; outline: none;">مهدی حسنی</a> توسعه یافته است
            </div>
            <div class="swal2-countdown">
              <span class="swal2-countdown-value">${toPersianDigits(30)}</span>
            </div>
          `,
                    timer: 30000,
                    showConfirmButton: false,
                    allowOutsideClick: true,
                    allowEscapeKey: true,
                    customClass: {
                        popup: 'swal2-rtl swal2-glass'
                    },
                    didOpen: () => {
                        const valueEl = Swal.getHtmlContainer()?.querySelector('.swal2-countdown-value');
                        if (valueEl) {
                            let remaining = 30;
                            countdownInterval = setInterval(() => {
                                remaining--;
                                if (remaining < 0) {
                                    clearInterval(countdownInterval);
                                } else {
                                    valueEl.textContent = toPersianDigits(remaining);
                                }
                            }, 1000);
                        }
                    },
                    willClose: () => {
                        if (countdownInterval) clearInterval(countdownInterval);
                    }
                });
            });
        }

        // Initialize
        if (checkAuth()) {
            loadDashboardData();
        }
    </script>
</body>

</html>
