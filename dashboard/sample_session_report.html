<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>صورتجلسه آزمون - نمونه</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/fonts/vazir/vazir.css">
  <style>
    @page { size: A4 portrait; margin: 18mm; }
    body { font-family: Vazir, Tahoma, Arial, sans-serif; color: #111; margin:0; padding:0; }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm; box-sizing: border-box; }
    .header { display:flex; gap:12px; align-items:center; justify-content: space-between; }
    .logo { width:90px; height:90px; object-fit:contain; }
    .header-right { text-align: center; flex:1; }
    .institute { font-size: 12pt; font-weight: 700; margin-top:6px; }
    .title { font-size: 18pt; font-weight: 800; text-align:center; margin: 6px 0; }
    .university { font-size: 13pt; text-align:center; color:#222; margin-bottom:6px; }
    .divider { height:1px; background:#111; margin:8px 0 12px 0; opacity:0.85; }

    .meta { font-size: 11pt; text-align: right; color:#222; margin-bottom:10px; }
    .meta strong { font-weight:800; }

    .courses { width:100%; border-collapse: collapse; font-size: 11pt; }
    .courses th, .courses td { padding:8px 10px; border-bottom: 1px solid #e0e0e0; }
    .courses thead th { background:#efefef; font-weight: 800; text-align:center; }
    .courses tbody tr:nth-child(odd) { background: #fafafa; }
    .courses td.name { text-align: right; }
    .courses td.center { text-align: center; }

    .footer-signs { margin-top: 28mm; }
    .sign-row { display:flex; gap:8px; justify-content: space-between; margin-bottom: 12mm; }
    .sign { width: 32%; text-align: center; }
    .sign .label { font-size: 10pt; color:#444; margin-bottom: 18px; }
    .sign .line { border-top:1px solid #111; margin:0 20px; height:1px; }

    /* small print adjustments for screen preview */
    @media screen {
      .sheet { box-shadow: 0 0 8px rgba(0,0,0,0.08); background: #fff; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="header">
      <div style="flex:0 0 120px; text-align:right;">
        <img src="/assets/app/Pnulogo.png" alt="PnuLogo" class="logo">
        <div style="font-size:10pt; margin-top:6px; text-align:center;">مرکز سنجش و آزمون</div>
      </div>
      <div class="header-right">
        <div class="title">صورتجلسه آزمون</div>
        <div class="university">دانشگاه پیام نور استان کردستان مرکز بیجار</div>
      </div>
      <div style="width:120px;"></div>
    </div>

    <div class="divider"></div>

    <div class="meta" id="reportMeta" data-exam-date="1404/10/02" data-exam-time="08:00">
      <div id="sessionMetaLine">آزمون دروس زیر در تاریخ <strong>۱۴۰۴/۱۰/۰۲</strong> | ساعت <strong>۰۸:۰۰</strong> آغاز گردید.</div>
      <div style="margin-top:6px; color:#666;">(نمونهٔ صورتجلسه؛ فیلدهای آماری و فهرست دروس از API/DB خوانده می‌شود)</div>
    </div>

    <div id="pagesContainer"><!-- pages will be rendered here by JS --></div>

  </div>
</body>
<script>
  // Compute semester and academic year based on Persian date YYYY/MM/DD (numbers)
  (function(){
    try {
      const meta = document.getElementById('reportMeta');
      if (!meta) return;
      const dateStr = meta.getAttribute('data-exam-date') || '';
      const timeStr = meta.getAttribute('data-exam-time') || '';
      // expect format like 1404/10/02
      const parts = (dateStr || '').split('/').map(s=>s.replace(/[^0-9]/g,''));
      if (parts.length < 3) return;
      const year = parseInt(parts[0],10);
      const month = parseInt(parts[1],10);
      const day = parseInt(parts[2],10);

      // Determine semester per user's rules:
      // months 9 or 10 => نیمسال اول
      // months 2 or 3 => نیمسال دوم
      // months 5 or 6 => دوره تابستان
      let semesterLabel = '';
      if ([9,10].includes(month)) semesterLabel = 'نیمسال اول';
      else if ([2,3].includes(month)) semesterLabel = 'نیمسال دوم';
      else if ([5,6].includes(month)) semesterLabel = 'دوره تابستان';
      else {
        // fallback: map common ranges (approximate)
        if (month >= 7 && month <= 12) semesterLabel = 'نیمسال اول';
        else if (month >= 1 && month <= 4) semesterLabel = 'نیمسال دوم';
        else semesterLabel = 'نامشخص';
      }

      // Academic year calculation as requested:
      // If semester is "نیمسال اول" => academic year = examYear and nextYear
      // Else (نیمسال دوم or تابستان) => academic year = previousYear and examYear
      let acadStart = year;
      let acadEnd = year + 1;
      if (semesterLabel === 'نیمسال اول') {
        acadStart = year;
        acadEnd = year + 1;
      } else if (semesterLabel === 'نیمسال دوم' || semesterLabel === 'دوره تابستان') {
        acadStart = year - 1;
        acadEnd = year;
      }

      // Display format: show as "<end>-<start>" per user's example (e.g., ۱۴۰۵-۱۴۰۴)
      const displayAcad = `${acadEnd}-${acadStart}`;

      // Replace Persian digits in display (optional) - keep latin digits but wrap with RTL
      const metaLineEl = document.getElementById('sessionMetaLine');
      // helper: convert western digits to Persian digits
      function toPersianDigits(s) {
        return String(s).replace(/[0-9]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; });
      }

      // Use labels similar to user's requested spelling (with 'ی' style if desired)
      const labelMap = {
        'نیمسال اول': 'نیمسال اول',
        'نیمسال دوم': 'نیمسال دوم',
        'دوره تابستان': 'دوره تابستان',
        'نامشخص': 'نامشخص'
      };
      const outSemester = labelMap[semesterLabel] || semesterLabel;

      // display academic year as start-end in Persian digits (user example uses ۱۴۰۴-۱۴۰۵)
      const persAcadStart = toPersianDigits(acadStart);
      const persAcadEnd = toPersianDigits(acadEnd);
      const persTime = toPersianDigits(timeStr);
      const persDate = toPersianDigits(dateStr);

      if (metaLineEl) {
        metaLineEl.innerHTML = `آزمون دروس زیر در ${outSemester} سالتحصیلی ${persAcadStart}-${persAcadEnd} با حضور امضاء كنندگان زیر در ساعت ${persTime} مورخ ${persDate} شروع گردید. ( نمونه سوال ضمیمه می باشد )`;
      }
    } catch (e) {
      console.error('Compute semester error', e);
    }
  })();
</script>
<script>
  // Render multiple pages with max 20 courses per page and signers listed as single-line entries
  (function(){
    const pagesContainer = document.getElementById('pagesContainer');
    if (!pagesContainer) return;

    // Build sample 38 courses
    const courses = [];
    for (let i = 1; i <= 38; i++) {
      courses.push({
        code: String(1100000 + i),
        name: `درس نمونه شماره ${i} - عنوان نمونه درس ${i}`,
        count: Math.floor(Math.random()*12)+1,
        // alternate types between الکترونیکی and کتبی
        type: (i % 2 === 0) ? 'الکترونیکی' : 'کتبی'
      });
    }

    // Sort: electronic first, then کتبی, and within each by numeric code
    courses.sort((a,b) => {
      if (a.type === b.type) return Number(a.code) - Number(b.code);
      if (a.type === 'الکترونیکی') return -1;
      if (b.type === 'الکترونیکی') return 1;
      return a.type.localeCompare(b.type);
    });

    // Sample signers (each on its own line)
    const signers = [
      'دكتر الهام قاسمی فر - رئیس مرکز',
      'مهدی حسنی - مسئول آموزش',
      'سید احمد موسوی - مسئول جلسه',
      'فاطمه محمدی - ناظر',
      'حسین رضایی - کارشناس اجرا'
    ];

    const metaEl = document.getElementById('reportMeta');
    const metaHtml = document.getElementById('sessionMetaLine')?.innerHTML || '';
    const headerHtml = `
      <div class="header">
        <div style="flex:0 0 120px; text-align:right;">
          <img src="/assets/app/Pnulogo.png" alt="PnuLogo" class="logo">
          <div style="font-size:10pt; margin-top:6px; text-align:center;">مرکز سنجش و آزمون</div>
        </div>
        <div class="header-right">
          <div class="title">صورتجلسه آزمون</div>
          <div class="university">دانشگاه پیام نور استان کردستان مرکز بیجار</div>
        </div>
        <div style="width:120px;"></div>
      </div>
      <div class="divider"></div>
      <div class="meta">${metaHtml}</div>`;

    function buildTable(slice, startIndex) {
      let t = '<table class="courses"><thead><tr><th style="width:6%">ردیف</th><th style="width:18%">کد درس</th><th style="width:46%">نام درس</th><th style="width:10%">نفر</th><th style="width:20%">نوع</th></tr></thead><tbody>';
      slice.forEach((c, idx) => {
        t += `<tr><td class="center">${startIndex + idx + 1}</td><td class="center">${c.code}</td><td class="name">${c.name}</td><td class="center">${c.count}</td><td class="center">${c.type}</td></tr>`;
      });
      t += '</tbody></table>';
      return t;
    }

    // page rendering
    const perPage = 20;
    const pages = Math.ceil(courses.length / perPage);
    for (let p = 0; p < pages; p++) {
      const start = p * perPage;
      const slice = courses.slice(start, start + perPage);
      const isLast = (p === pages -1);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.innerHTML = headerHtml + buildTable(slice, start);
      // append signers block (footer) on every page; on last page it appears after the table as well
      {
        let signsHtml = '<div class="footer-signs">';
        // use a smaller top margin for intermediate pages so table has room
        const topMargin = isLast ? '18mm' : '8mm';
        signsHtml += `<div style="margin-top:${topMargin};">`;
        signers.forEach(s => {
          signsHtml += `<div style="margin-bottom:10px; text-align:right; font-size:11pt;">`;
          signsHtml += `<div style="display:block; border-top:1px solid #111; padding-top:6px; width:60%;">${s}</div>`;
          signsHtml += `</div>`;
        });
        signsHtml += '</div></div>';
        sheet.innerHTML += signsHtml;
      }

      pagesContainer.appendChild(sheet);
    }

    // ensure sheets break pages when printing
    const style = document.createElement('style');
    style.innerHTML = '.sheet{ page-break-after: always; } .sheet:last-child{ page-break-after: auto; }';
    document.head.appendChild(style);
  })();
</script>
</html>
