<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chart.js CDN Demo - نسار</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <style>
    body{font-family: Vazir, Tahoma, Arial, sans-serif; background: #f6fbff; color:#04202a; padding:2rem}
    .card{background:white;border-radius:12px;padding:1rem;box-shadow:0 6px 20px rgba(2,18,24,0.06);max-width:980px;margin:0 auto}
    .center{display:flex;align-items:center;justify-content:center;flex-direction:column}
    canvas{max-width:100%;height:360px}
    .hint{color:#6c757d;font-size:0.95rem;margin-top:0.6rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="center">
      <h4>نمونه Chart.js از CDN</h4>
      <p class="hint">این نمونه Chart.js را از CDN بارگذاری می‌کند و داده را از API می‌گیرد (با fallback به دادهٔ mock اگر API در دسترس نباشد).</p>
      <div style="width:100%">
        <canvas id="demoChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Chart.js from CDN (v4) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // Helper: convert numbers to Persian digits for display
    function toPersianDigits(num){ return String(num).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]) }

    // Attempt to fetch data from backend API; if it fails, use mock data
    async function fetchChartData(){
      try{
        const res = await fetch('/API/getChartData.php?metric=students&group=daily');
        if(!res.ok) throw new Error('network');
        const json = await res.json();
        // Expecting { labels: [...], datasets: [...] }
        if(json && json.labels && json.datasets) return json;
        throw new Error('invalid');
      }catch(e){
        // Mock data fallback
        const labels = [];
        const data = [];
        const today = new Date();
        for(let i=6;i>=0;i--){
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
          labels.push(`${d.getFullYear()}/${('0'+(d.getMonth()+1)).slice(-2)}/${('0'+d.getDate()).slice(-2)}`);
          data.push(Math.floor(Math.random()*60)+10);
        }
        return {
          labels,
          datasets:[{
            label:'تعداد دانشجویان',
            data,
            borderColor:'rgba(60,166,255,1)',
            backgroundColor:'rgba(60,166,255,0.12)',
            tension:0.25,
            fill:true
          }]
        }
      }
    }

    (async function(){
      const chartData = await fetchChartData();
      const ctx = document.getElementById('demoChart').getContext('2d');

      const config = {
        type: 'line',
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins:{
            legend:{position:'top', labels:{usePointStyle:true}},
            tooltip:{mode:'index', intersect:false}
          },
          scales: {
            x: { ticks:{color:'#04425a'} },
            y: { ticks:{color:'#04425a', callback: v => toPersianDigits(v) } }
          }
        }
      };

      // Create chart instance
      const myChart = new Chart(ctx, config);

      // Example: update chart when user clicks canvas (demo)
      document.getElementById('demoChart').addEventListener('click', ()=>{
        // simple randomize on click
        myChart.data.datasets[0].data = myChart.data.datasets[0].data.map(()=>Math.floor(Math.random()*80)+5);
        myChart.update();
      });
    })();
  </script>
</body>
</html>
