<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2196F3" />
  <title>نسار - سامانه نمایش شماره صندلی‌ آزمون‌های دانشگاه پیام نور بیجار</title>
  <link rel="manifest" href="manifest.json?v=10" />
  <!-- iOS PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="نسار" />
  <!-- Android/Chrome color -->
  <meta name="theme-color" content="#2196F3" />
  <link rel="icon" type="image/png" href="assets/app/logo.png" />
  <link rel="shortcut icon" type="image/png" href="assets/app/logo.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="pwa-icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="pwa-icons/icon-512.png" />
  <link rel="canonical" href="https://seat.pnubijar.ac.ir/" />
  <link rel="stylesheet" href="assets/fonts/vazir/vazir.css" />
  <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/sweetalert2/sweetalert2.min.css" />
  <link rel="stylesheet" href="assets/app/style.css" />
  <script>
    (function () {
      try {
        var cookies = document.cookie ? document.cookie.split(';') : [];
        for (var i = 0; i < cookies.length; i++) {
          var c = cookies[i].trim();
          if (c.indexOf('userSession=') === 0) {
            document.documentElement.classList.add('session-cookie-detected');
            break;
          }
        }
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <!-- Logo Section - Fixed at top left of page -->
  <div class="logo-container">
    <img src="assets/app/Pnulogo.png" alt="لوگو پیام نور" class="logo-image" />
  </div>
  
  <div class="container-fluid">
    <div id="loginRow" class="row min-vh-100 d-none">
      <!-- Login Form Section -->
      <div id="loginSection" class="col-12 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
          <div class="col-lg-4 col-md-6 col-sm-8">
            <div class="card shadow-lg">
              <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">اعتبار سنجی</h4>
              </div>
              <div class="card-body p-4">
                <form id="examForm" novalidate>
                  <!-- User Type Selection -->
                  <div class="mb-4">
                    <div class="form-check form-check-inline">
                      <label class="form-check-label" for="studentType">
                        دانشجو
                      </label>
                      <input class="form-check-input" type="radio" name="userType" id="studentType" value="student" checked>
                    </div>
                    <div class="form-check form-check-inline">
                      <label class="form-check-label" for="staffType" title="به‌زودی">
                        همکار (به‌زودی)
                      </label>
                      <input class="form-check-input" type="radio" name="userType" id="staffType" value="staff" disabled>
                    </div>
                  </div>
                  
                  <div class="mb-3">
                    <label for="studentId" class="form-label" id="firstFieldLabel">شماره دانشجویی</label>
                    <input
                      type="tel"
                      class="form-control form-control-lg text-center"
                      id="studentId"
                      placeholder="مثال: 403254321"
                      inputmode="numeric"
                    />
                  </div>
                  <div class="mb-4">
                    <label for="nationalId" class="form-label" id="secondFieldLabel">کد ملی / شماره شناسنامه</label>
                    <input
                      type="tel"
                      class="form-control form-control-lg text-center"
                      id="nationalId"
                      placeholder="مثال: 3781985569"
                      inputmode="numeric"
                    />
                  </div>
                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="searchBtn">
                      <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                      <span class="text">ورود به سیستم</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Cards Section -->
    <section id="cardsSection" class="container py-4 px-0">
      <div id="examCards" class="exam-cards-container"></div>
    </section>
  </div>
<Br><Br>
  <!-- Fixed Footer -->
  <footer class="fixed-footer text-white" id="copyrightFooter" style="cursor: pointer;">
    <span class="footer-text" id="footerText">نسار - دانشگاه پیام نور بیجار</span>
    <span class="footer-spacer" aria-hidden="true"></span>
    <span class="footer-clock" id="footerClock" aria-live="polite">در حال به‌روزرسانی...</span>
  </footer>

  <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/sweetalert2/sweetalert2.min.js"></script>
  <script src="assets/crypto-js.min.js"></script>
  <script src="assets/app/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/service-worker.js')
          .catch(err => console.error('Service worker registration failed:', err));
      });
    }
  </script>
</body>
  <div class="waves-header" aria-hidden="true">
    <div class="waves-inner-header"></div>
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
      </defs>
      <g class="parallax">
  <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(12, 114, 173, 0.22)" />
  <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(18, 126, 189, 0.28)" />
  <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(24, 140, 205, 0.32)" />
  <use xlink:href="#gentle-wave" x="48" y="7" fill="#1a6fa6" />
      </g>
    </svg>
  </div>
</html>
