<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2196F3" />
  <title>سامانه شماره صندلی</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/fonts/vazir/vazir.css" />
  <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/sweetalert2/sweetalert2.min.css" />
  <link rel="stylesheet" href="assets/app/style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg">
          <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">مشاهده شماره صندلی امتحان</h4>
          </div>
          <div class="card-body p-4">
            <form id="examForm">
              <div class="mb-3">
                <label for="studentId" class="form-label">شماره دانشجویی</label>
                <input
                  type="tel"
                  class="form-control form-control-lg text-center"
                  id="studentId"
                  placeholder="مثال: ۹۷۴۵۶۱۲۳"
                  inputmode="numeric"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="nationalId" class="form-label">کد ملی</label>
                <input
                  type="tel"
                  class="form-control form-control-lg text-center"
                  id="nationalId"
                  placeholder="مثال: ۱۲۳۴۵۶۷۸۹۰"
                  inputmode="numeric"
                  required
                />
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg" id="searchBtn">
                  <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  <span class="text">جستجو</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="results" class="mt-4 d-none">
      <div class="card shadow-lg">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">نتایج جستجو</h5>
          <button type="button" class="btn-close btn-close-white" id="closeResults" aria-label="بستن"></button>
        </div>
        <div class="card-body" id="resultContent"></div>
      </div>
    </div>
  </div>

  <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/sweetalert2/sweetalert2.min.js"></script>
  <script src="assets/app/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/service-worker.js')
          .catch(err => console.error('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
