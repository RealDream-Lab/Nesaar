version: "3.9"

services:
  web:
    image: ghcr.io/mehdihassaniir/pnuseat:latest
    container_name: pnuseat_web
    ports:
      - "18080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-PnuExamsSeatNumber}
      DB_USER: ${DB_USER:-pnu_user}
      DB_PASS: ${DB_PASS:-change_me}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - pnuseat_network

  db:
    image: mysql:8.0
    container_name: pnuseat_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-super_secure_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-PnuExamsSeatNumber}
      MYSQL_USER: ${MYSQL_USER:-pnu_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - pnuseat_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pnuseat_phpmyadmin
    restart: unless-stopped
    ports:
      - "18081:80"
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: http://localhost:18081/
    depends_on:
      - db
    networks:
      - pnuseat_network

volumes:
  db_data:

networks:
  pnuseat_network: